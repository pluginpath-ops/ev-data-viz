                                        ...chartConfig,
                                        xAxis: preset.x,
                                        yAxis: preset.y
                                    })}
                                    className="btn"
                                    style={{
                                        backgroundColor: 'var(--color-primary-light)',
                                        color: 'var(--color-primary-text)'
                                    }}
                                >
                                    {preset.name}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <label className="block font-medium mb-2">X-Axis:</label>
                                <select 
                                    value={chartConfig.xAxis}
                                    onChange={(e) => setChartConfig({...chartConfig, xAxis: e.target.value})}
                                    className="border p-2 rounded w-full"
                                >
                                    {axisOptions.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block font-medium mb-2">Y-Axis:</label>
                                <select 
                                    value={chartConfig.yAxis}
                                    onChange={(e) => setChartConfig({...chartConfig, yAxis: e.target.value})}
                                    className="border p-2 rounded w-full"
                                >
                                    {axisOptions.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div>
                            <label className="block font-medium mb-2">Select Runs to Display:</label>
                            <div className="space-y-4">
                                {selectedVehicles.map(vehicle => {
                                    const isExpanded = expandedVehicles[vehicle.id];
                                    const activeRuns = vehicle.runs?.filter(r => chartConfig.selectedRuns.includes(r.id)) || [];
                                    const inactiveRuns = vehicle.runs?.filter(r => !chartConfig.selectedRuns.includes(r.id)) || [];
                                    const hasInactiveRuns = inactiveRuns.length > 0;
                                    
                                    return (
                                        <div key={vehicle.id} className="border-l-4 pl-4" style={{borderColor: 'var(--color-primary)'}}>
                                            <div className="flex items-center gap-2 mb-2">
                                                <h4 className="font-semibold text-gray-700">{vehicle.name}</h4>
                                                {hasInactiveRuns && (
                                                    <button
                                                        onClick={() => toggleVehicleExpanded(vehicle.id)}
                                                        className="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-1"
                                                    >
                                                        <span style={{
                                                            display: 'inline-block',
                                                            transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)',
                                                            transition: 'transform 0.2s'
                                                        }}>▼</span>
                                                        <span>{isExpanded ? 'Hide' : 'Show'} all ({vehicle.runs?.length || 0})</span>
                                                    </button>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                {/* Active runs - always shown */}
                                                {activeRuns.map(run => (
                                                    <label key={run.id} className="flex items-center gap-2">
                                                        <input 
                                                            type="checkbox"
                                                            checked={true}
                                                            onChange={(e) => {
                                                                setChartConfig({
                                                                    ...chartConfig,
                                                                    selectedRuns: chartConfig.selectedRuns.filter(id => id !== run.id)
                                                                });
                                                            }}
                                                            className="w-4 h-4"
                                                        />
                                                        <input
                                                            type="color"
                                                            value={run.color || '#3b82f6'}
                                                            onChange={(e) => {
                                                                e.stopPropagation();
                                                                handleColorChange(vehicle.id, run.id, e.target.value);
                                                            }}
                                                            onClick={(e) => e.stopPropagation()}
                                                            className="w-8 h-6 border-0 rounded cursor-pointer"
                                                            title="Change color"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={run.color || '#3b82f6'}
                                                            onChange={(e) => {
                                                                e.stopPropagation();
                                                                const value = e.target.value;
                                                                // Always update to allow typing
                                                                handleColorChange(vehicle.id, run.id, value);
                                                            }}
                                                            onBlur={(e) => {
                                                                // Validate and reset on blur if invalid
                                                                const value = e.target.value;
                                                                if (!/^#[0-9A-Fa-f]{6}$/.test(value)) {
                                                                    handleColorChange(vehicle.id, run.id, run.color || '#3b82f6');
                                                                }
                                                            }}
                                                            onClick={(e) => e.stopPropagation()}
                                                            className="w-20 px-2 py-0.5 border rounded text-xs font-mono"
                                                            placeholder="#3b82f6"
                                                            maxLength={7}
                                                        />
                                                        <span className="flex-1">
                                                            {run.name} 
                                                            <span className="text-sm text-gray-500"> ({run.date})</span>
                                                            {run.isDefault && <span className="ml-2 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded" style={{backgroundColor: 'var(--color-primary-light)', color: 'var(--color-primary-text)'}}>Default</span>}
                                                        </span>
                                                    </label>
                                                ))}
                                                
                                                {/* Inactive runs - shown when expanded */}
                                                {isExpanded && inactiveRuns.map(run => (
                                                    <label key={run.id} className="flex items-center gap-2 opacity-60 hover:opacity-100">
                                                        <input 
                                                            type="checkbox"
                                                            checked={false}
                                                            onChange={(e) => {
                                                                setChartConfig({
                                                                    ...chartConfig,
                                                                    selectedRuns: [...chartConfig.selectedRuns, run.id]
                                                                });
                                                            }}
                                                            className="w-4 h-4"
                                                        />
                                                        <input
                                                            type="color"
                                                            value={run.color || '#3b82f6'}
                                                            onChange={(e) => {
                                                                e.stopPropagation();
                                                                handleColorChange(vehicle.id, run.id, e.target.value);
                                                            }}
                                                            onClick={(e) => e.stopPropagation()}
                                                            className="w-8 h-6 border-0 rounded cursor-pointer"
                                                            title="Change color"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={run.color || '#3b82f6'}
                                                            onChange={(e) => {
                                                                e.stopPropagation();
                                                                const value = e.target.value;
                                                                handleColorChange(vehicle.id, run.id, value);
                                                            }}
                                                            onBlur={(e) => {
                                                                const value = e.target.value;
                                                                if (!/^#[0-9A-Fa-f]{6}$/.test(value)) {
                                                                    handleColorChange(vehicle.id, run.id, run.color || '#3b82f6');
                                                                }
                                                            }}
                                                            onClick={(e) => e.stopPropagation()}
                                                            className="w-20 px-2 py-0.5 border rounded text-xs font-mono"
                                                            placeholder="#3b82f6"
                                                            maxLength={7}
                                                        />
                                                        <span className="flex-1">
                                                            {run.name} 
                                                            <span className="text-sm text-gray-500"> ({run.date})</span>
                                                            {run.isDefault && <span className="ml-2 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded" style={{backgroundColor: 'var(--color-primary-light)', color: 'var(--color-primary-text)'}}>Default</span>}
                                                        </span>
                                                    </label>
                                                ))}
                                                
                                                {(!vehicle.runs || vehicle.runs.length === 0) && (
                                                    <p className="text-sm text-gray-500 italic">No runs available</p>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <div style={{ height: '500px' }}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    {chartConfig.selectedRuns.length === 0 && (
                        <div className="text-center py-12 text-gray-500">
                            <p className="text-lg">Select runs to display on the chart</p>
                        </div>
                    )}
                </div>
            );
        }

        // Specs View
        function SpecsView({ vehicles, selectedVehicleIds }) {
            // Filter to only show selected vehicles, or all if none selected
            const displayVehicles = selectedVehicleIds.length > 0 
                ? vehicles.filter(v => selectedVehicleIds.includes(v.id))
                : vehicles;

            return (
                <div>
                    <h2 className="text-2xl font-bold mb-6">
                        Vehicle Specifications Comparison
                        {selectedVehicleIds.length > 0 && ` (${selectedVehicleIds.length} Selected)`}
                    </h2>

                    {displayVehicles.length === 0 ? (
                        <div className="text-center py-12 text-gray-500">
                            <p className="text-lg">
                                {vehicles.length === 0 
                                    ? 'No vehicles to compare. Add vehicles first!' 
                                    : 'No vehicles selected. Select vehicles from the Vehicles page to compare them here.'}
                            </p>
                        </div>
                    ) : (
                        <div className="bg-white rounded-lg shadow overflow-x-auto" style={{backgroundColor: 'var(--color-card)'}}>
                            <table className="w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left font-semibold">Specification</th>
                                        {displayVehicles.map(v => (
                                            <th key={v.id} className="px-6 py-3 text-left font-semibold">{v.name}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y">
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Make</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.make || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Model</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.model || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Year</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.year || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Battery (kWh)</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.battery || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">EPA Range (mi)</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.range || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Peak Power (kW)</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.power || '-'}</td>)}
                                    </tr>
                                    <tr>
                                        <td className="px-6 py-4 font-medium">Test Runs</td>
                                        {displayVehicles.map(v => <td key={v.id} className="px-6 py-4">{v.runs?.length || 0}</td>)}
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
